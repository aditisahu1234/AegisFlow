apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:
  name: aegisflow-gateway-pdb
  namespace: aegisflow

spec:
  minAvailable: 1   #never allow running pods to be below 1
  terminationGracePeriodSeconds: 30
  unhealthyPodEvictionPolicy: AlwaysAllow
  
  selector:
    matchLabels:
      app.kubernetes.io/name: aegisflow
      app.kubernetes.io/component: gateway