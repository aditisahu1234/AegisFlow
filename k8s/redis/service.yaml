apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: aegisflow

  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: aegisflow-platform

spec:

  type: ClusterIP     #cluster since redis should never be exposed to the internet

  selector:
    app.kubernetes.io/name: redis

  ports:
  - name: redis

    port: 6379

    targetPort: 6379

    protocol: TCP