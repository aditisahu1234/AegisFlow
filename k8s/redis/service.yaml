apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: aegisflow

  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: aegisflow-platform

spec:
  selector:
    app.kubernetes.io/name: redis

  ports:
  - port: 6379
    targetPort: 6379

  type: ClusterIP