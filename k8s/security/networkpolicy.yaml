apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: redis-only-gateway
  namespace: aegisflow

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway

      ports:
        - protocol: TCP
          port: 6379